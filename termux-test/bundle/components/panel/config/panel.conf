# mux-panel — default configuration
# Install to: ~/.config/muxlike/panel.conf
# Colours are the approved MuxLike palette: violet #7c5cff,
# mint #00c2a8, coral #ff6f61, dark base #12141f, light #e8eaf6.
# Hex may carry an alpha byte (#rrggbbaa) — the panel is translucent.

[panel]
height = 30
background = #12141fd9
foreground = #e8eaf6
muted = #a7abc0
accent = #7c5cff
font = Sans 11
# strftime format, macOS menu-bar style: "Tue 25 Nov  21:07"
clock_format = %a %d %b  %I:%M %p
show_battery = true
show_network = true

[menu]
background = #1b1e2af2
# Commands run when a menu item is clicked. mux-settings / mux-logout
# are MuxLike's own binaries (Settings app / session helper); until the
# session helper exists, Log Out can point at "labwc --exit"-style
# commands chosen by the integration step.
about_cmd = muxinfo
settings_cmd = mux-settings
sleep_cmd = systemctl suspend
restart_cmd = systemctl reboot
shutdown_cmd = systemctl poweroff
logout_cmd = mux-logout
