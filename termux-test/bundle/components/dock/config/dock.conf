# mux-dock — default configuration
# Install to: ~/.config/muxlike/dock.conf
# Colours are the approved MuxLike palette: violet #7c5cff,
# mint #00c2a8, coral #ff6f61, dark base #12141f, light #e8eaf6.

[dock]
icon_size = 48
magnify = true
magnification = 1.35
magnify_radius = 110
spacing = 8
padding = 10
margin_bottom = 10
corner_radius = 18
background = #12141fb3
foreground = #e8eaf6
muted = #a7abc0
accent = #7c5cff
# Floating dock by default: it does not push windows aside.
# true = reserve screen space (exclusive zone) like a fixed dock.
reserve_space = false
# First tile (Mux logo) runs this:
launcher_cmd = mux-launcher
# Pinned apps by desktop-file id (searched in the standard
# applications dirs). Not-installed entries are skipped, and running
# apps that are not pinned are appended automatically.
pinned = mux-files,mux-browser,mux-terminal,mux-settings,mux-store,mux-music,mux-photos,mux-notes,mux-calendar,mux-mail
