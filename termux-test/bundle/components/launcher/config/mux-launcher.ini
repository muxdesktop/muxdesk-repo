# mux-launcher config — উদাহরণ ফাইল
# আসল জায়গা: ~/.config/muxdesk/mux-launcher.ini
# এই ফাইলটা ওখানে copy করে মান বদলাও। ফাইল না থাকলে default-ই চলে।

[general]
# icon theme — অনুমোদিত MuxLike theme-ই default
icon-theme=MuxLike
# খোলা/বন্ধ animation (ms), 0 = animation বন্ধ
animation-ms=180

[grid]
# Launchpad grid: প্রতি page-এ columns × rows টা app
columns=7
rows=4
# icon-এর আকার (px)
icon-size=96

[search]
# Spotlight ফলাফলে সর্বোচ্চ কটা app
max-results=8
# ফাইল খোঁজা চালু/বন্ধ (hook) — বন্ধ রাখলে শুধু app খুঁজবে
file-search=true
# $HOME-এর নিচে কত গভীরে ফাইল খুঁজবে
file-max-depth=3
# সর্বোচ্চ কটা ফাইল ফলাফল
file-max-results=5
