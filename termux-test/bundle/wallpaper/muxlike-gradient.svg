<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- MuxLike gradient wallpaper — আমাদের নিজের আঁকা (FINAL)
       palette: violet #7c5cff / coral #ff6f61 / mint #00c2a8
       sample ছবির ধাঁচে নরম রঙের ঢেউ; Apple-এর কোনো wallpaper copy না। -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a5e"/><stop offset="0.45" stop-color="#7c5cff"/>
      <stop offset="0.75" stop-color="#ff6f61"/><stop offset="1" stop-color="#ffb59d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#ff6f61" stop-opacity="0.85"/><stop offset="1" stop-color="#ff6f61" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveMint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c2a8"/><stop offset="1" stop-color="#5a3fd4"/>
    </linearGradient>
    <linearGradient id="waveDeep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12141f"/><stop offset="1" stop-color="#2a1a5e"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <circle cx="1380" cy="300" r="120" fill="#fff3d6" opacity="0.9"/>
  <path d="M0 560 C 300 460, 620 660, 960 570 S 1620 470, 1920 590 L1920 1080 L0 1080 Z" fill="#7c5cff" opacity="0.45"/>
  <path d="M0 700 C 340 600, 700 810, 1080 715 S 1660 620, 1920 740 L1920 1080 L0 1080 Z" fill="url(#waveMint)" opacity="0.8"/>
  <path d="M0 860 C 380 770, 760 950, 1140 865 S 1680 790, 1920 890 L1920 1080 L0 1080 Z" fill="url(#waveDeep)" opacity="0.95"/>
</svg>
