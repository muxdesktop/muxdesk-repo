# MuxOS 1.0 LTS (freeze 1.2) - merge into /etc/pacman.conf
# 1) the [muxdesk-lts] block goes BEFORE [core]/[extra]/[alarm]/[aur]
# 2) the IgnorePkg lines from pins-ignorepkg.txt go into [options]

[muxdesk-lts]
SigLevel = Never
Server = https://muxdesktop.github.io/muxdesk-repo/lts/1.2/$arch

[muxdesk]
SigLevel = Never
Server = https://muxdesktop.github.io/muxdesk-repo/$arch
